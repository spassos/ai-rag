[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lupa-publica"
version = "0.1.0"
description = "RAG sobre gastos públicos (Portal da Transparência) — Lupa Pública"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightrag-hku==1.5.3",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lupa-publica = "lupa_publica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
